{% extends "pages/base.html" %}

{% block title %}{{ title }} - SAMS{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h1 class="h2 mb-0">{{ title }}</h1>
    <a class="btn btn-primary" href="{% url create_url %}">Create</a>
</div>
<div class="card shadow-sm">
    <div class="list-group list-group-flush">
        {% for record in records %}
            <div class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2">
                <a href="{% url detail_url record.pk %}">{{ record }}</a>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-secondary btn-sm" href="{% url update_url record.pk %}">Edit</a>
                    <form method="post" action="{% url delete_url record.pk %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                    </form>
                </div>
            </div>
        {% empty %}
            <div class="list-group-item text-muted">No records found.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
