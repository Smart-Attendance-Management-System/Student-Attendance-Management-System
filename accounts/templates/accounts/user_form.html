{% extends "pages/base.html" %}

{% block title %}{{ title }} | SAMS{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="mt-3" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-outline-secondary" href="{% url 'accounts:list' %}">Cancel</a>
</form>
{% endblock %}
