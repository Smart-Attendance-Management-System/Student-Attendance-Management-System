{% extends "pages/base.html" %}
{% block title %}Password updated | SAMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm text-center">
      <div class="card-body py-5">
        <h1 class="h4 mb-3">Password updated</h1>
        <p class="text-muted">Your password has been reset. You can now sign in with your new password.</p>
        <a class="btn btn-primary" href="{% url 'login' %}">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
