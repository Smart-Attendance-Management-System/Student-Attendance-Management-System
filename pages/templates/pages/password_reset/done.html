{% extends "pages/base.html" %}
{% block title %}Check your email | SAMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm text-center">
      <div class="card-body py-5">
        <h1 class="h4 mb-3">Check your email</h1>
        <p class="text-muted">If an account exists for the email address you entered, we have sent password reset instructions.</p>
        <a class="btn btn-outline-primary" href="{% url 'login' %}">Back to sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
