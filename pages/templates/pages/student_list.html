{% extends "pages/base.html" %}
{% block title %}Students - SAMS{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Students</h1>
<div class="table-responsive">
  <table class="table table-striped table-hover bg-white align-middle">
    <thead>
      <tr><th>Roll no.</th><th>Name</th><th>Class</th><th>Contact</th></tr>
    </thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ s.roll_number }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.student_class }}</td>
        <td>{{ s.contact_details }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted">No students yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
